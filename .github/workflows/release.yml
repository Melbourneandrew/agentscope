name: Prepare durable release candidate
on:
  workflow_dispatch:
    inputs:
      operation:
        required: true
        type: choice
        options:
          [
            prepare-draft,
            consume-intent,
            prepare-probe,
            consume-probe,
            reconcile-probe,
            prepare-publication,
            consume-publication,
            record-approval,
            continue-publication,
          ]
      candidate-run-id:
        required: true
        type: string
      candidate-manifest-digest:
        required: true
        type: string
      transaction-id:
        required: true
        type: string
      release-id:
        type: string
      environment-id:
        type: string
      owner-observation:
        type: string
      stage-tuple:
        type: string
      expected-sequence:
        type: string
      expected-prior-digest:
        type: string
permissions:
  contents: read
concurrency:
  group: agentscope-release-records
  cancel-in-progress: false
jobs:
  verify-candidate:
    if: github.ref == 'refs/tags/v0.1.0' || (github.ref == 'refs/heads/main' && contains(fromJSON('["prepare-probe","consume-probe","reconcile-probe"]'), inputs.operation))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:release-admission
      - name: Authenticate successful Integration artifacts
        id: admission-artifacts
        run: node scripts/record-release-stage.mjs --prepare-admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Download exact prepared candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.admission-artifacts.outputs.candidate-artifact-id }}
          path: artifacts/semantic-candidate
          run-id: ${{ inputs.candidate-run-id }}
          github-token: ${{ github.token }}
          merge-multiple: true
      - name: Download bounded scenario evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.admission-artifacts.outputs.scenario-artifact-id }}
          path: artifacts/semantic-scenarios
          run-id: ${{ inputs.candidate-run-id }}
          github-token: ${{ github.token }}
          merge-multiple: true
      - name: Require nonprivileged semantic admission
        run: node scripts/record-release-stage.mjs --verify-admission
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: github.ref == 'refs/tags/v0.1.0'
        with:
          name: release-certified-candidate
          path: artifacts/release-candidate
          run-id: ${{ inputs.candidate-run-id }}
          github-token: ${{ github.token }}
      - if: github.ref == 'refs/tags/v0.1.0'
        run: >-
          node scripts/verify-release-candidate.mjs
          --artifact-root artifacts/release-candidate
          --manifest-relative candidate-manifest.json
          --certification-relative certification-record.json
          --tarball-relative agentscope-cli-0.1.0.tgz
          --manifest-digest "$CANDIDATE_MANIFEST_DIGEST"
          --source-revision "$GITHUB_SHA" --protected-tag v0.1.0
        env:
          CANDIDATE_MANIFEST_DIGEST: ${{ inputs.candidate-manifest-digest }}
      - if: inputs.operation == 'prepare-probe'
        run: npm install -g npm@11.17.0 --ignore-scripts
      - if: inputs.operation == 'prepare-probe'
        run: node scripts/record-release-stage.mjs --prepare-probe
      - if: inputs.operation == 'prepare-probe'
        run: npm pack ./artifacts/release-probe-source --ignore-scripts --json --pack-destination ./artifacts/release-probe
      - if: inputs.operation == 'prepare-probe'
        run: node scripts/record-release-stage.mjs --verify-probe
      - if: inputs.operation == 'prepare-probe'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-inert-probe
          path: artifacts/release-probe
          if-no-files-found: error
      - if: inputs.operation == 'consume-probe'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-inert-probe
          path: artifacts/release-probe
          run-id: ${{ inputs.candidate-run-id }}
          github-token: ${{ github.token }}
      - if: inputs.operation == 'consume-probe'
        run: node scripts/record-release-stage.mjs --verify-probe
      - if: inputs.operation == 'reconcile-probe'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-probe-stage-${{ fromJSON(fromJSON(inputs.owner-observation).probePacket).runAttempt }}
          path: artifacts/reconciled-probe
          run-id: ${{ inputs.candidate-run-id }}
          github-token: ${{ github.token }}
      - if: inputs.operation == 'reconcile-probe'
        run: node scripts/record-release-stage.mjs --verify-probe
  prepare-draft:
    if: inputs.operation != 'prepare-probe' && inputs.operation != 'continue-publication'
    needs: verify-candidate
    outputs:
      intent-digest: ${{ steps.record.outputs.intent-digest }}
    environment: npm-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:release-admission
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: github.ref == 'refs/tags/v0.1.0'
        with:
          name: release-certified-candidate
          path: artifacts/release-candidate
          run-id: ${{ inputs.candidate-run-id }}
          github-token: ${{ github.token }}
      - if: inputs.operation == 'consume-probe'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-inert-probe
          path: artifacts/release-probe
          run-id: ${{ inputs.candidate-run-id }}
          github-token: ${{ github.token }}
      - if: inputs.operation == 'reconcile-probe'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-probe-stage-${{ fromJSON(fromJSON(inputs.owner-observation).probePacket).runAttempt }}
          path: artifacts/reconciled-probe
          run-id: ${{ inputs.candidate-run-id }}
          github-token: ${{ github.token }}
      - id: record
        run: node scripts/record-release-stage.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_MANIFEST_DIGEST: ${{ inputs.candidate-manifest-digest }}
          RELEASE_TRANSACTION_ID: ${{ inputs.transaction-id }}
      - if: inputs.operation == 'consume-probe'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-probe-intent-${{ github.run_attempt }}
          path: artifacts/retained-probe/probe-intent.json
          if-no-files-found: error
      - if: inputs.operation == 'reconcile-probe'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-probe-terminal-${{ github.run_attempt }}
          path: artifacts/retained-probe/probe-terminal-manifest.json
          if-no-files-found: error
  stage-candidate:
    if: inputs.operation == 'consume-intent' || inputs.operation == 'consume-probe'
    needs: [verify-candidate, prepare-draft]
    environment: npm-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      stage-result: ${{ steps.stage.outputs.stage-result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:release-admission
      - run: npm install -g npm@11.17.0 --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: github.ref == 'refs/tags/v0.1.0'
        with:
          name: release-certified-candidate
          path: artifacts/release-candidate
          run-id: ${{ inputs.candidate-run-id }}
          github-token: ${{ github.token }}
      - if: inputs.operation == 'consume-probe'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-inert-probe
          path: artifacts/release-probe
          run-id: ${{ inputs.candidate-run-id }}
          github-token: ${{ github.token }}
      - if: inputs.operation == 'consume-probe'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-probe-intent-${{ github.run_attempt }}
          path: artifacts/retained-probe
      - id: stage
        run: node scripts/record-release-stage.mjs --stage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_INTENT_DIGEST: ${{ needs.prepare-draft.outputs.intent-digest }}
  record-stage:
    if: always() && (inputs.operation == 'consume-intent' || inputs.operation == 'consume-probe') && needs.prepare-draft.result == 'success'
    needs: [prepare-draft, stage-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:release-admission
      - if: inputs.operation == 'consume-probe'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-probe-intent-${{ github.run_attempt }}
          path: artifacts/retained-probe
      - run: node scripts/record-release-stage.mjs --record-stage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_INTENT_DIGEST: ${{ needs.prepare-draft.outputs.intent-digest }}
          RELEASE_STAGE_RESULT: ${{ needs.stage-candidate.outputs.stage-result }}
      - if: inputs.operation == 'consume-probe'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-probe-stage-${{ github.run_attempt }}
          path: artifacts/retained-probe/probe-stage-packet.json
          if-no-files-found: error
  verify-publication:
    if: inputs.operation == 'continue-publication' && github.ref == 'refs/tags/v0.1.0'
    needs: verify-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      registry-result: ${{ steps.verify.outputs.registry-result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:release-admission
      - run: npm install -g npm@11.17.0 --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-certified-candidate
          path: artifacts/release-candidate
          run-id: ${{ inputs.candidate-run-id }}
          github-token: ${{ github.token }}
      - id: verify
        run: node scripts/record-release-stage.mjs --verify-publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
  continue-publication:
    if: inputs.operation == 'continue-publication' && github.ref == 'refs/tags/v0.1.0'
    needs: [verify-candidate, verify-publication]
    environment: npm-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:release-admission
      - run: node scripts/record-release-stage.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_REGISTRY_RESULT: ${{ needs.verify-publication.outputs.registry-result }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-completion-${{ github.run_attempt }}
          path: artifacts/retained-probe/release-completion-manifest.json
          if-no-files-found: error
