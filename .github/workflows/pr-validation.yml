name: PR validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  NX_SKIP_NX_CACHE: "true"

jobs:
  quality:
    if: github.event_name == 'pull_request'
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:workspace
      - run: pnpm verify:coverage-ratchet --base=origin/main
      - run: pnpm verify:acceptance-evidence
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    if: github.event_name == 'pull_request'
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm coverage
      - run: pnpm build
      - run: pnpm verify:cli-artifact

  pty-runtime:
    name: PTY runtime proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replay the bounded PTY ABI in the canonical network-off image
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          deadline=$((SECONDS + 90))
          docker=/usr/bin/docker
          timeout=/usr/bin/timeout
          socket=/var/run/docker.sock
          image=node@sha256:76789712cd1ae89a1225eac9077010d68987a423588042dac30446f502f1858c
          config_id=sha256:395425e54d98ebbd748d388685a0c2de151a30fa92fffc10ba30fa63f3db64d6
          name=agentscope-pty-runtime-proof-v1
          root=
          repository_root=
          container_id=
          created=false
          stage=setup
          runtime_receipt_authenticated=false
          cleanup_interrupt() {
            cleanup_signal_status=$1
            cleanup_proved=false
          }
          record_cleanup_failure() {
            local command_status=$1
            cleanup_proved=false
            if (( command_status == 130 || command_status == 143 )); then
              cleanup_signal_status=$command_status
            fi
          }
          cleanup() {
            local primary_status=$?
            local failure_stage=$stage
            local cleanup_proved=true
            local cleanup_signal_status=0
            local terminal_status=failed
            trap - EXIT
            trap 'cleanup_interrupt 130' INT
            trap 'cleanup_interrupt 143' TERM
            cleanup_docker_call() {
              local remaining=$((deadline - SECONDS))
              (( remaining >= 7 ))
              "$timeout" --foreground --signal=TERM --kill-after=1 2s \
                "$docker" --config "$root/config" --host "unix://$socket" "$@" 2>/dev/null
            }
            if [[ "$created" == true && "$container_id" =~ ^[0-9a-f]{64}$ ]]; then
              cleanup_docker_call rm --force "$container_id" >/dev/null || record_cleanup_failure "$?"
              survivor=$(cleanup_docker_call container ls --all --no-trunc --quiet --filter "id=$container_id") || record_cleanup_failure "$?"
              [[ -z "${survivor:-uncertain}" ]] || cleanup_proved=false
            fi
            remaining=$((deadline - SECONDS))
            if [[ -n "$root" && "$root" =~ ^/tmp/agentscope-pty-runtime\.[A-Za-z0-9]{8}$ && -d "$root" && ! -L "$root" ]] && (( remaining >= 3 )); then
              "$timeout" --foreground --signal=TERM --kill-after=1 1s /bin/rm -rf -- "$root" 2>/dev/null || record_cleanup_failure "$?"
            elif [[ -n "$root" ]]; then
              cleanup_proved=false
            fi
            (( SECONDS <= deadline )) || cleanup_proved=false
            trap '' INT TERM
            if (( cleanup_signal_status != 0 )); then
              cleanup_proved=false
              if (( primary_status == 0 )); then
                primary_status=$cleanup_signal_status
                failure_stage=cleanup
              fi
            fi
            if (( primary_status == 0 )) && [[ "$failure_stage" == final-assertion && "$runtime_receipt_authenticated" == true && "$cleanup_proved" == true ]]; then
              terminal_status=passed
            elif (( primary_status == 0 )); then
              primary_status=1
              if [[ "$cleanup_proved" != true ]]; then
                failure_stage=cleanup
              fi
            fi
            case "$failure_stage" in
              setup|input-identity|image-identity|create|runtime-receipt|terminal-join|cleanup|final-assertion) ;;
              *) failure_stage=cleanup; cleanup_proved=false; primary_status=1 ;;
            esac
            printf '{"version":1,"stage":"%s","status":"%s","runtimeReceiptAuthenticated":%s,"cleanupProved":%s}\n' \
              "$failure_stage" "$terminal_status" "$runtime_receipt_authenticated" "$cleanup_proved" >&2
            exit "$primary_status"
          }
          interrupt() {
            exit "$1"
          }
          trap cleanup EXIT
          trap 'interrupt 130' INT
          trap 'interrupt 143' TERM
          host_call() {
            local remaining=$((deadline - SECONDS - 10))
            (( remaining > 0 ))
            "$timeout" --foreground --signal=TERM --kill-after=2 "${remaining}s" "$@" 2>/dev/null
          }
          root=$(host_call /usr/bin/mktemp -d /tmp/agentscope-pty-runtime.XXXXXXXX)
          [[ -d "$root" && ! -L "$root" ]]
          repository_root=$(host_call /usr/bin/realpath .)
          stage=input-identity
          [[ -x "$docker" && -x "$timeout" && -S "$socket" && ! -L "$socket" ]]
          [[ "$repository_root" == /home/runner/work/agentscope/agentscope ]]
          host_call /bin/mkdir -m 0700 "$root/config"
          docker_call() {
            local remaining=$((deadline - SECONDS - 10))
            (( remaining > 0 ))
            "$timeout" --foreground --signal=TERM --kill-after=5 "${remaining}s" \
              "$docker" --config "$root/config" --host "unix://$socket" "$@" 2>/dev/null
          }
          [[ -z "$(docker_call container ls --all --quiet --filter "name=^/${name}$")" ]]
          stage=image-identity
          docker_call pull --quiet --platform linux/amd64 "$image" >/dev/null
          identity=$(docker_call image inspect --format '{{.Id}}|{{.Os}}|{{.Architecture}}' "$config_id")
          [[ "$identity" == "$config_id|linux|amd64" ]]
          stage=create
          create_status=0
          reported_id=$(docker_call create \
              --name "$name" --network none --platform linux/amd64 --read-only \
              --tmpfs /tmp:rw,nosuid,nodev,noexec,mode=0700,size=16m \
              --mount "type=bind,src=$repository_root/packages/testkit/pty-runtime/node127-linux-x64-musl/pty.node,dst=/runtime/production.node,readonly" \
              --mount "type=bind,src=$repository_root/packages/testkit/fixtures/pty-runtime-faults/node127-linux-x64-musl/pty.node,dst=/runtime/faults.node,readonly" \
              --mount "type=bind,src=$repository_root,dst=/workspace,readonly" \
              "$image" /usr/local/bin/node /workspace/packages/testkit/scripts/verify-pty-runtime.mjs --runtime-proof) || create_status=$?
          container_id=$(docker_call container ls --all --no-trunc --quiet --filter "name=^/${name}$")
          [[ "$container_id" =~ ^[0-9a-f]{64}$ ]]
          created=true
          (( create_status == 0 ))
          [[ "$reported_id" == "$container_id" ]]
          authority=$(docker_call inspect --format '{{.Id}}|{{.Image}}|{{.HostConfig.NetworkMode}}|{{.HostConfig.ReadonlyRootfs}}|{{.State.Status}}' "$container_id")
          [[ "$authority" == "$container_id|$config_id|none|true|created" ]]
          stage=runtime-receipt
          docker_call start --attach "$container_id" >"$root/receipt.json"
          [[ ! -L "$root/receipt.json" && -f "$root/receipt.json" ]]
          [[ $(host_call /usr/bin/stat -c %s "$root/receipt.json") == 32 ]]
          receipt_digest=$(host_call /usr/bin/sha256sum "$root/receipt.json")
          [[ "${receipt_digest%% *}" == 709d35b6bbb00dad49454715be8809fda10f96a50219caca8fbed53594b488d1 ]]
          [[ "$(host_call /bin/cat "$root/receipt.json")" == '{"version":1,"status":"passed"}' ]]
          runtime_receipt_authenticated=true
          stage=terminal-join
          terminal=$(docker_call inspect --format '{{.State.Status}}|{{.State.ExitCode}}|{{.State.Running}}|{{.State.Pid}}' "$container_id")
          [[ "$terminal" == 'exited|0|false|0' ]]
          stage=final-assertion

  docs:
    if: github.event_name == 'pull_request'
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agentscope/docs build

  native:
    name: Native candidate verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select native candidate verification
        id: selection
        env:
          NATIVE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NATIVE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$NATIVE_HEAD_SHA"
          node scripts/native-ci-selection.mjs
      - name: Report native candidate verification skip
        if: steps.selection.outputs.required != 'true'
        run: echo "Native candidate verification skipped — ${{ steps.selection.outputs.reason }}"
      - name: Remove inputs certified irrelevant to the native candidate
        if: steps.selection.outputs.required == 'true'
        run: node scripts/native-ci-selection.mjs --prune-irrelevant
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.selection.outputs.required == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.selection.outputs.required == 'true'
        with: { node-version: 22, cache: pnpm }
      - if: steps.selection.outputs.required == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.selection.outputs.required == 'true'
        run: pnpm nx build agentscope-cli --skip-nx-cache
      - if: steps.selection.outputs.required == 'true'
        run: pnpm verify:cli-artifact
      - name: Run fresh non-admitting native candidate verification
        if: steps.selection.outputs.required == 'true'
        run: pnpm verify:native-candidate
