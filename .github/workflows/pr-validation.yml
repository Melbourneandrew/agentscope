name: PR validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  NX_SKIP_NX_CACHE: "true"

jobs:
  quality:
    if: github.event_name == 'pull_request'
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:workspace
      - run: pnpm verify:coverage-ratchet --base=origin/main
      - run: pnpm verify:acceptance-evidence
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    if: github.event_name == 'pull_request'
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm coverage
      - run: pnpm build
      - run: pnpm verify:cli-artifact

  pty-runtime:
    name: PTY runtime proof
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - name: Replay the bounded PTY ABI in the canonical network-off image
        run: node scripts/pty-runtime-proof-controller.mjs

  docs:
    if: github.event_name == 'pull_request'
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agentscope/docs build

  native:
    name: Native candidate verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Authenticate exact native candidate checkout
        env:
          NATIVE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$NATIVE_HEAD_SHA"
      - name: Remove inputs certified irrelevant to the native candidate
        run: node scripts/native-ci-selection.mjs --prune-irrelevant
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx build agentscope-cli --skip-nx-cache
      - run: pnpm verify:cli-artifact
      - name: Bind native disposition to fresh packed CLI
        id: disposition
        env:
          NATIVE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          test "$(git rev-parse HEAD)" = "$NATIVE_HEAD_SHA" &&
          git diff --quiet HEAD -- scripts/native-candidate-release-profile.json scripts/native-ci-disposition.mjs scripts/release-lane/candidate.mjs &&
          node scripts/native-ci-disposition.mjs
          --profile scripts/native-candidate-release-profile.json
          --profile-blob "$(git rev-parse HEAD:scripts/native-candidate-release-profile.json)"
          --packed-tarball artifacts/npm/agentscope-cli-0.1.0.tgz
          --source-revision "$NATIVE_HEAD_SHA"
          --output "$GITHUB_OUTPUT"
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Select native candidate verification for proposed tuple
        id: selection
        if: steps.disposition.outputs.required == 'true'
        env:
          NATIVE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NATIVE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/native-ci-selection.mjs
      - name: Report Local SQLite not admitted
        if: steps.disposition.outputs.required == 'false'
        run: echo "Local SQLite not admitted — packed executable tuple absent"
      - name: Report irrelevant proposed tuple change
        if: steps.disposition.outputs.required == 'true' && steps.selection.outputs.required != 'true'
        run: echo "Native candidate verification skipped — ${{ steps.selection.outputs.reason }}"
      - name: Run fresh non-admitting native candidate verification
        if: steps.disposition.outputs.required == 'true' && steps.selection.outputs.required == 'true'
        run: pnpm verify:native-candidate
