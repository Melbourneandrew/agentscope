name: PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:workspace
      - run: pnpm verify:coverage-ratchet --base=origin/main
      - run: pnpm verify:acceptance-evidence
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm coverage
      - run: pnpm build
      - run: pnpm verify:cli-artifact
      - run: pnpm verify:native-candidate

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agentscope/docs build

  crabbox-launcher:
    name: Crabbox launcher contract
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          {
            go-version: 1.26.5,
            cache-dependency-path: tools/crabbox-launcher/go.mod,
          }
      - run: go test -race ./...
        working-directory: tools/crabbox-launcher
      - run: go vet ./...
        working-directory: tools/crabbox-launcher
      - run: sudo "$(command -v go)" test ./internal/control -run '^TestUIDProcessSetContainsImmediateDetachedChild$' -count=1
        working-directory: tools/crabbox-launcher
      - run: go build -trimpath -buildvcs=true ./cmd/agentscope-crabbox-control
        working-directory: tools/crabbox-launcher
      - run: sh -n ops/crabbox-coordinator/install-protected-launcher.sh
      - run: sh scripts/verify-crabbox-launcher-installer.sh
