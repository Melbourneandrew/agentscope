name: Directory native candidate (nonpublishing)

on:
  pull_request:
    paths:
      - .github/workflows/directory-native-candidate.yml
      - packages/harnesses/core/native-directory/**
      - packages/harnesses/core/src/native-directory-candidate.test.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: directory-native-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: node@sha256:bb6834c0669aa71cbc8d94606561a721adf489f6b93d7b8b825f0cf1b498c2c4
    outputs:
      header-artifact-id: ${{ steps.headers.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build exact Linux candidate and retain pinned-image headers
        run: /usr/local/bin/node packages/harnesses/core/native-directory/build-candidate.mjs linux-x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: headers
        with:
          name: directory-native-headers-${{ github.run_id }}
          path: artifacts/directory-native/headers/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: directory-native-linux-x64-${{ github.run_id }}
          path: |
            artifacts/directory-native/linux-x64/directory.node
            artifacts/directory-native/linux-x64/observed-materials.json
          if-no-files-found: error
          retention-days: 7

  darwin-arm64:
    needs: linux-x64
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
          architecture: arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.linux-x64.outputs.header-artifact-id }}
          path: artifacts/directory-native/headers/
          merge-multiple: true
      - name: Verify Apple material, then build exact Darwin candidate
        run: node packages/harnesses/core/native-directory/build-candidate.mjs darwin-arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: directory-native-darwin-arm64-${{ github.run_id }}
          path: |
            artifacts/directory-native/darwin-arm64/directory.node
            artifacts/directory-native/darwin-arm64/observed-materials.json
          if-no-files-found: error
          retention-days: 7

  candidate-terminal:
    if: always()
    needs: [linux-x64, darwin-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require both candidate rows, never assert publication admission
        env:
          LINUX_RESULT: ${{ needs.linux-x64.result }}
          DARWIN_RESULT: ${{ needs.darwin-arm64.result }}
        run: |
          test "$LINUX_RESULT" = success
          test "$DARWIN_RESULT" = success
          printf '%s\n' 'Both native candidates produced; retained artifacts remain unadmitted.'
