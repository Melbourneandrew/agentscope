name: Integration matrix

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scenario:
        description: Exact manifest scenario ID to replay; empty selects the shard
        required: false
        type: string
      shard:
        description: Deterministic index/total shard selector
        required: false
        type: string
      mockserver_research:
        description: Run bounded MockServer supplier research only; never scenario or certification evidence
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-candidate:
    name: Prepare immutable candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - name: Establish job-scoped integration deadline
        run: echo "AGENTSCOPE_INTEGRATION_OUTER_DEADLINE_MONOTONIC_MS=$(awk '{ printf "%.0f", ($1 * 1000) + 1200000 }' /proc/uptime)" >> "$GITHUB_ENV"
      - name: Initialize closed npm configuration
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/agentscope-global.npmrc"
          install -m 600 /dev/null "$RUNNER_TEMP/agentscope-user.npmrc"
          echo "NPM_CONFIG_GLOBALCONFIG=$RUNNER_TEMP/agentscope-global.npmrc" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/agentscope-user.npmrc" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install immutable workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and prepare candidate once
        env:
          AGENTSCOPE_INTEGRATION_MODE: candidate
        run: |
          pnpm build
          pnpm test:integration
      - name: Publish checksum-bound candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-candidate-${{ github.sha }}
          path: |
            artifacts/integration/candidates
            artifacts/integration/current-candidate.json
          if-no-files-found: error
          retention-days: 1
  hermetic-platform:
    if: ${{ !inputs.mockserver_research }}
    name: Hermetic shard ${{ matrix.shard.name }} replay ${{ matrix.replay }}
    needs: prepare-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    strategy:
      fail-fast: false
      matrix:
        shard:
          - selector: "0/1"
            name: 0-of-1
        replay: [1, 2, 3]
    steps:
      - name: Establish job-scoped integration deadline
        run: echo "AGENTSCOPE_INTEGRATION_OUTER_DEADLINE_MONOTONIC_MS=$(awk '{ printf "%.0f", ($1 * 1000) + 1200000 }' /proc/uptime)" >> "$GITHUB_ENV"
      - name: Initialize closed npm configuration
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/agentscope-global.npmrc"
          install -m 600 /dev/null "$RUNNER_TEMP/agentscope-user.npmrc"
          echo "NPM_CONFIG_GLOBALCONFIG=$RUNNER_TEMP/agentscope-global.npmrc" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/agentscope-user.npmrc" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install immutable workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace fixture code
        run: pnpm build
      - name: Download exact prepared candidate
        uses: actions/download-artifact@v4
        with:
          name: integration-candidate-${{ github.sha }}
          path: artifacts/integration
      - name: Run the private integration lifecycle
        env:
          AGENTSCOPE_INTEGRATION_CONCURRENCY: "2"
          AGENTSCOPE_INTEGRATION_TIMEOUT_MS: "300000"
          AGENTSCOPE_SUBSTRATE_CERTIFICATION_REPLAY: ${{ matrix.replay }}
          REPLAY_SCENARIO: ${{ inputs.scenario }}
          REPLAY_SHARD: ${{ inputs.shard || matrix.shard.selector }}
        run: |
          if [ -n "$REPLAY_SCENARIO" ]; then
            export AGENTSCOPE_INTEGRATION_SCENARIO="$REPLAY_SCENARIO"
          else
            export AGENTSCOPE_INTEGRATION_SHARD="$REPLAY_SHARD"
          fi
          pnpm test:integration
      - name: Verify complete sanitized failure evidence
        id: failure_evidence
        if: failure()
        run: node tests/integration/verify-substrate-certification.mjs failure
      - name: Upload sanitized failure evidence
        if: failure() && steps.failure_evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.shard.name }}-${{ matrix.replay }}
          path: |
            artifacts/integration/controller-failure-manifest.json
            artifacts/integration/runs/*/controller-failure.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload clean certification receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: substrate-certification-replay-${{ matrix.replay }}-${{ github.sha }}
          path: artifacts/integration/certification/replay-${{ matrix.replay }}.json
          if-no-files-found: error
          retention-days: 7
  controlled-negative:
    if: ${{ !inputs.mockserver_research }}
    name: Substrate rejects ${{ matrix.case }}
    needs: prepare-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    strategy:
      fail-fast: false
      matrix:
        case:
          - wrong-argv
          - wrong-environment
          - wrong-cwd
          - missing-hook
          - leaked-child
          - unbounded-output
          - false-success
          - mixed-artifact-digest
          - public-egress
          - credential-presence
          - cleanup-failure
    steps:
      - name: Establish job-scoped integration deadline
        run: echo "AGENTSCOPE_INTEGRATION_OUTER_DEADLINE_MONOTONIC_MS=$(awk '{ printf "%.0f", ($1 * 1000) + 1200000 }' /proc/uptime)" >> "$GITHUB_ENV"
      - name: Initialize closed npm configuration
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/agentscope-global.npmrc"
          install -m 600 /dev/null "$RUNNER_TEMP/agentscope-user.npmrc"
          echo "NPM_CONFIG_GLOBALCONFIG=$RUNNER_TEMP/agentscope-global.npmrc" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/agentscope-user.npmrc" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install immutable workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace fixture code
        run: pnpm build
      - name: Download exact prepared candidate
        uses: actions/download-artifact@v4
        with:
          name: integration-candidate-${{ github.sha }}
          path: artifacts/integration
      - name: Run one terminal controlled rejection
        id: controlled_rejection
        continue-on-error: true
        env:
          AGENTSCOPE_INTEGRATION_CONCURRENCY: "1"
          AGENTSCOPE_INTEGRATION_SCENARIO: fixture-process-smoke
          AGENTSCOPE_INTEGRATION_TIMEOUT_MS: "300000"
          AGENTSCOPE_SUBSTRATE_CERTIFICATION_CASE: ${{ matrix.case }}
        run: |
          if test "$AGENTSCOPE_SUBSTRATE_CERTIFICATION_CASE" = credential-presence; then
            export OPENAI_API_KEY=AGENTSCOPE_SYNTHETIC_CANARY
          fi
          pnpm test:integration
      - name: Require exact sanitized rejection evidence
        if: always()
        env:
          AGENTSCOPE_SUBSTRATE_CERTIFICATION_CASE: ${{ matrix.case }}
          CONTROLLED_REJECTION_OUTCOME: ${{ steps.controlled_rejection.outcome }}
        run: |
          test "$CONTROLLED_REJECTION_OUTCOME" = failure
          node tests/integration/verify-substrate-certification.mjs negative
      - name: Upload sanitized controlled-rejection evidence
        if: success() && matrix.case != 'credential-presence'
        uses: actions/upload-artifact@v4
        with:
          name: substrate-certification-negative-${{ matrix.case }}-${{ github.sha }}
          path: |
            artifacts/integration/controller-failure-manifest.json
            artifacts/integration/runs/*/controller-failure.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload sanitized preflight rejection evidence
        if: success() && matrix.case == 'credential-presence'
        uses: actions/upload-artifact@v4
        with:
          name: substrate-certification-negative-${{ matrix.case }}-${{ github.sha }}
          path: artifacts/integration/controller-preflight-failure.json
          if-no-files-found: error
          retention-days: 7
  substrate-certification-fan-in:
    if: ${{ !inputs.mockserver_research }}
    name: substrate-certification
    needs: hermetic-platform
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install immutable workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build certification verifier
        run: pnpm --filter '@agentscope/integration...' build
      - name: Download exactly three clean receipts
        uses: actions/download-artifact@v4
        with:
          pattern: substrate-certification-replay-*-${{ github.sha }}
          path: artifacts/integration/certification-fan-in
          merge-multiple: true
      - name: Compare exact stable replay identities
        run: |
          chmod 600 artifacts/integration/certification-fan-in/replay-*.json
          node tests/integration/verify-substrate-certification.mjs fan-in
  hermetic-integration:
    name: hermetic-integration
    if: always() && !inputs.mockserver_research
    needs:
      [
        prepare-candidate,
        hermetic-platform,
        controlled-negative,
        substrate-certification-fan-in,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every hermetic integration job
        env:
          CANDIDATE_RESULT: ${{ needs.prepare-candidate.result }}
          NEGATIVE_RESULT: ${{ needs.controlled-negative.result }}
          PLATFORM_RESULT: ${{ needs.hermetic-platform.result }}
          CERTIFICATION_RESULT: ${{ needs.substrate-certification-fan-in.result }}
        run: |
          test "$CANDIDATE_RESULT" = success
          test "$PLATFORM_RESULT" = success
          test "$NEGATIVE_RESULT" = success
          test "$CERTIFICATION_RESULT" = success
  mockserver-supplier-research:
    name: MockServer supplier research (not certification)
    if: github.event_name == 'workflow_dispatch' && inputs.mockserver_research
    needs: prepare-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGENTSCOPE_MOCKSERVER_RESEARCH: supplier
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - name: Reject contradictory research selectors
        env:
          REQUEST_SCENARIO: ${{ inputs.scenario }}
          REQUEST_SHARD: ${{ inputs.shard }}
        run: |
          test -z "$REQUEST_SCENARIO"
          test -z "$REQUEST_SHARD"
      - name: Establish job-scoped integration deadline
        run: echo "AGENTSCOPE_INTEGRATION_OUTER_DEADLINE_MONOTONIC_MS=$(awk '{ printf "%.0f", ($1 * 1000) + 1200000 }' /proc/uptime)" >> "$GITHUB_ENV"
      - name: Initialize closed npm configuration
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/agentscope-global.npmrc"
          install -m 600 /dev/null "$RUNNER_TEMP/agentscope-user.npmrc"
          echo "NPM_CONFIG_GLOBALCONFIG=$RUNNER_TEMP/agentscope-global.npmrc" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/agentscope-user.npmrc" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install immutable workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace fixture code
        run: pnpm build
      - name: Download exact prepared candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: integration-candidate-${{ github.sha }}
          path: artifacts/integration
      - name: Require settled research stop and independently verified packet
        id: research_packet
        run: |
          diagnostic_output() {
            { printf '%s=%s\n' "$1" "$2" >> "${GITHUB_OUTPUT:-/dev/null}"; } 2>/dev/null || :
          }
          diagnostic_exit() {
            original_status=$?
            trap - EXIT
            diagnostic_output shell_status "$original_status"
            exit "$original_status"
          }
          trap diagnostic_exit EXIT
          diagnostic_output shell_entered true
          set +e
          pnpm test:integration
          status=$?
          if [[ "$status" =~ ^(0|[1-9][0-9]{0,2})$ ]] && (( status <= 255 )); then
            diagnostic_output command_status "$status"
          fi
          set -e
          ( printf 'integration.mockserver-research.command-status=%s\n' "$status" ) || :
          test "$status" -eq 3
          ( printf 'integration.mockserver-research.verifier-enter\n' ) || :
          node tests/integration/verify-mockserver-research.mjs
          ( printf 'integration.mockserver-research.verifier-complete\n' ) || :
      - name: Project closed research shell observations
        if: always()
        env:
          OBSERVED_OUTCOME: ${{ steps.research_packet.outcome }}
          OBSERVED_ENTERED: ${{ steps.research_packet.outputs.shell_entered }}
          OBSERVED_COMMAND_STATUS: ${{ steps.research_packet.outputs.command_status }}
          OBSERVED_SHELL_STATUS: ${{ steps.research_packet.outputs.shell_status }}
          OBSERVED_SUPERVISOR: ${{ steps.research_packet.outputs.supervisor_observation }}
          OBSERVED_SUPERVISOR_CODE: ${{ steps.research_packet.outputs.supervisor_code }}
          OBSERVED_SUPERVISOR_SIGNAL: ${{ steps.research_packet.outputs.supervisor_signal }}
          OBSERVED_CONTAINED: ${{ steps.research_packet.outputs.supervisor_contained }}
          OBSERVED_RESIDUAL: ${{ steps.research_packet.outputs.supervisor_residual }}
          OBSERVED_TERMINATION: ${{ steps.research_packet.outputs.supervisor_termination }}
          OBSERVED_WITHIN_DEADLINE: ${{ steps.research_packet.outputs.supervisor_within_deadline }}
          OBSERVED_FAILURE: ${{ steps.research_packet.outputs.controller_failure }}
          OBSERVED_STAGE: ${{ steps.research_packet.outputs.controller_stage }}
          OBSERVED_KIND: ${{ steps.research_packet.outputs.controller_kind }}
          OBSERVED_CLEANUP: ${{ steps.research_packet.outputs.controller_cleanup }}
          OBSERVED_PULL_TRIGGER: ${{ steps.research_packet.outputs.controller_pull_trigger }}
          OBSERVED_RECONCILIATION: ${{ steps.research_packet.outputs.controller_reconciliation }}
          OBSERVED_MATERIAL_PHASE: ${{ steps.research_packet.outputs.material_phase }}
          OBSERVED_UNTRUSTED_BOOTSTRAP_STAGE: ${{ steps.research_packet.outputs.untrusted_bootstrap_stage }}
          OBSERVED_UNTRUSTED_BOOTSTRAP_FAILURE_FAMILY: ${{ steps.research_packet.outputs.untrusted_bootstrap_failure_family }}
          OBSERVED_UNTRUSTED_MAVEN_FAILURE: ${{ steps.research_packet.outputs.untrusted_maven_failure }}
          OBSERVED_UNTRUSTED_BUILDER_OPERATION: ${{ steps.research_packet.outputs.untrusted_builder_operation }}
          OBSERVED_UNTRUSTED_BUILDER_OUTCOME: ${{ steps.research_packet.outputs.untrusted_builder_outcome }}
          OBSERVED_UNTRUSTED_BUILDER_OBSERVED: ${{ steps.research_packet.outputs.untrusted_builder_observed }}
          OBSERVED_UNTRUSTED_BUILDER_EXITED: ${{ steps.research_packet.outputs.untrusted_builder_exited }}
          OBSERVED_UNTRUSTED_BUILDER_SIGNALED: ${{ steps.research_packet.outputs.untrusted_builder_signaled }}
          OBSERVED_UNTRUSTED_BUILDER_TIMED_OUT: ${{ steps.research_packet.outputs.untrusted_builder_timed_out }}
          OBSERVED_UNTRUSTED_BUILDER_JOINED: ${{ steps.research_packet.outputs.untrusted_builder_joined }}
          OBSERVED_UNTRUSTED_BUILDER_STDERR_CLASS: ${{ steps.research_packet.outputs.untrusted_builder_stderr_class }}
        run: |
          outcome=unknown
          case "$OBSERVED_OUTCOME" in success|failure|cancelled|skipped) outcome="$OBSERVED_OUTCOME" ;; esac
          entered=unknown
          test "$OBSERVED_ENTERED" != true || entered=true
          command_status=unknown
          shell_status=unknown
          if [[ "$OBSERVED_COMMAND_STATUS" =~ ^(0|[1-9][0-9]{0,2})$ ]] && (( OBSERVED_COMMAND_STATUS <= 255 )); then command_status="$OBSERVED_COMMAND_STATUS"; fi
          if [[ "$OBSERVED_SHELL_STATUS" =~ ^(0|[1-9][0-9]{0,2})$ ]] && (( OBSERVED_SHELL_STATUS <= 255 )); then shell_status="$OBSERVED_SHELL_STATUS"; fi
          observation="integration.mockserver-research.shell-observation outcome=$outcome shell_entered=$entered command_status=$command_status shell_status=$shell_status"
          ( printf '%s\n' "$observation" ) || :
          { printf '%s\n' "$observation" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"; } 2>/dev/null || :
          supervisor=unknown; supervisor_code=unknown; supervisor_signal=unknown; contained=unknown; residual=unknown; termination=unknown; within_deadline=unknown
          failure=unknown; stage=unknown; kind=unknown; cleanup=unknown; trigger=unknown; reconciliation=unknown
          material_phase=unknown
          untrusted_bootstrap_stage=unknown; untrusted_bootstrap_failure_family=unknown
          untrusted_builder_operation=unknown; untrusted_builder_outcome=unknown; untrusted_builder_stderr_class=unknown
          untrusted_builder_observed=unknown; untrusted_builder_exited=unknown; untrusted_builder_signaled=unknown; untrusted_builder_timed_out=unknown; untrusted_builder_joined=unknown
          case "$OBSERVED_UNTRUSTED_BUILDER_OPERATION" in preflight|builder-create|builder-bootstrap|image-build) untrusted_builder_operation="$OBSERVED_UNTRUSTED_BUILDER_OPERATION" ;; esac
          case "$OBSERVED_UNTRUSTED_BUILDER_OUTCOME" in retired-failure|failed-settled) untrusted_builder_outcome="$OBSERVED_UNTRUSTED_BUILDER_OUTCOME" ;; esac
          case "$OBSERVED_UNTRUSTED_BUILDER_STDERR_CLASS" in resource-conflict|build-failed|bootstrap-failed|permission-denied) untrusted_builder_stderr_class="$OBSERVED_UNTRUSTED_BUILDER_STDERR_CLASS" ;; esac
          case "$OBSERVED_UNTRUSTED_BUILDER_OBSERVED" in true|false) untrusted_builder_observed="$OBSERVED_UNTRUSTED_BUILDER_OBSERVED" ;; esac
          case "$OBSERVED_UNTRUSTED_BUILDER_EXITED" in true|false) untrusted_builder_exited="$OBSERVED_UNTRUSTED_BUILDER_EXITED" ;; esac
          case "$OBSERVED_UNTRUSTED_BUILDER_SIGNALED" in true|false) untrusted_builder_signaled="$OBSERVED_UNTRUSTED_BUILDER_SIGNALED" ;; esac
          case "$OBSERVED_UNTRUSTED_BUILDER_TIMED_OUT" in true|false) untrusted_builder_timed_out="$OBSERVED_UNTRUSTED_BUILDER_TIMED_OUT" ;; esac
          case "$OBSERVED_UNTRUSTED_BUILDER_JOINED" in true|false) untrusted_builder_joined="$OBSERVED_UNTRUSTED_BUILDER_JOINED" ;; esac
          case "$OBSERVED_UNTRUSTED_BOOTSTRAP_STAGE" in authenticate-inputs|keyrings|import-key|export-key|selected-key-file|import-selected|list-key|listing-policy|verify-signature|signature-policy|signature-recordset|signature-recordset-information|signature-recordset-rejection|signature-recordset-unknown|signature-count|signature-compliance|signature-signer|signature-algorithm|signature-hash|signature-class|signature-time|signature-key-time|checksum-policy|completed|supplier-connected-entry|supplier-connected-extract|supplier-connected-package|supplier-connected-package-compilation|supplier-connected-package-resolution|supplier-connected-package-frontend|supplier-connected-package-other|supplier-connected-service-finalization|supplier-connected-inventory|supplier-connected-inventory-read|supplier-connected-inventory-guard|supplier-connected-inventory-internal|supplier-connected-output-create|supplier-connected-output-write|supplier-entry|supplier-extract|supplier-package|supplier-package-compilation|supplier-package-resolution|supplier-package-frontend|supplier-package-other|supplier-service-finalization|supplier-inventory|supplier-inventory-read|supplier-inventory-guard|supplier-inventory-internal|supplier-output-create|supplier-output-write) untrusted_bootstrap_stage="$OBSERVED_UNTRUSTED_BOOTSTRAP_STAGE" ;; esac
          case "$OBSERVED_UNTRUSTED_BOOTSTRAP_FAILURE_FAMILY" in none|input|filesystem|gpg-execution|listing-policy|signature-policy|checksum-policy) untrusted_bootstrap_failure_family="$OBSERVED_UNTRUSTED_BOOTSTRAP_FAILURE_FAMILY" ;; esac
          case "$untrusted_bootstrap_stage:$untrusted_bootstrap_failure_family" in supplier-*:none) ;; supplier-*:*) untrusted_bootstrap_stage=unknown; untrusted_bootstrap_failure_family=unknown ;; esac
          untrusted_maven_failure=unknown
          if [[ "$OBSERVED_UNTRUSTED_MAVEN_FAILURE" =~ ^(absent|overflow|ambiguous|unlisted|identified),(0|[1-9][0-9]{0,2}),[0-4],(0|[1-9]|1[0-2]),[0-6],(0|[1-9][0-9]{0,5}),(0|[1-9][0-9]{0,5}),[0-6]$ ]]; then
            IFS=, read -r md me ms mg mu ml mc mr <<< "$OBSERVED_UNTRUSTED_MAVEN_FAILURE"
            if (( me <= 256 )) && { [[ "$mu" == 0 && "$ml:$mc:$mr" == 0:0:0 ]] || (( mu > 0 && ml > 0 && mc > 0 && mr > 0 )); } && { [[ "$md" == identified ]] && (( mg > 0 || mu > 0 )) || [[ "$md" == ambiguous && "$mu" == 0 ]] || [[ "$md" != identified && "$md" != ambiguous && "$mg:$mu" == 0:0 ]]; }; then
              case "$untrusted_bootstrap_stage:$untrusted_bootstrap_failure_family" in supplier-*-package-*:none|supplier-package-*:none) untrusted_maven_failure="$OBSERVED_UNTRUSTED_MAVEN_FAILURE" ;; esac
            fi
          fi
          case "$OBSERVED_MATERIAL_PHASE" in research-preflight|research-client|research-inventory|research-close|bootstrap-preflight|download-source|download-maven|download-node|download-jdk|verify-archives|pinned-metadata|download-maven-key|download-maven-signature|verify-maven|verify-node|verify-jdk|retire-maven|retire-node|retire-jdk|bootstrap-cleanup|supplier-context|supplier-build|supplier-inventory|supplier-cleanup) material_phase="$OBSERVED_MATERIAL_PHASE" ;; esac
          case "$OBSERVED_SUPERVISOR" in terminal|rejected) supervisor="$OBSERVED_SUPERVISOR" ;; esac
          if [[ "$OBSERVED_SUPERVISOR_CODE" =~ ^(0|[1-9][0-9]{0,2})$ ]] && (( OBSERVED_SUPERVISOR_CODE <= 255 )); then supervisor_code="$OBSERVED_SUPERVISOR_CODE"; fi
          case "$OBSERVED_SUPERVISOR_SIGNAL" in none|SIGTERM|SIGKILL|SIGINT|SIGABRT|SIGSEGV|SIGBUS|SIGILL|SIGFPE|SIGHUP|SIGQUIT|SIGPIPE) supervisor_signal="$OBSERVED_SUPERVISOR_SIGNAL" ;; esac
          case "$OBSERVED_CONTAINED" in true|false) contained="$OBSERVED_CONTAINED" ;; esac
          case "$OBSERVED_RESIDUAL" in true|false) residual="$OBSERVED_RESIDUAL" ;; esac
          case "$OBSERVED_TERMINATION" in true|false) termination="$OBSERVED_TERMINATION" ;; esac
          case "$OBSERVED_WITHIN_DEADLINE" in true|false) within_deadline="$OBSERVED_WITHIN_DEADLINE" ;; esac
          case "$OBSERVED_FAILURE" in integration.controller.failed|integration.controller.retire-outer-host) failure="$OBSERVED_FAILURE" ;; esac
          case "$OBSERVED_STAGE" in clean|maintainArtifacts|prepareCandidate|prepareImages|prepareModelRoutes|runScenarios|select) stage="$OBSERVED_STAGE" ;; esac
          case "$OBSERVED_KIND" in operation-grace-unsettled|pull-outcome-unknown|preparation-failed) kind="$OBSERVED_KIND" ;; esac
          case "$OBSERVED_CLEANUP" in none|failed|not-attempted) cleanup="$OBSERVED_CLEANUP" ;; esac
          case "$OBSERVED_PULL_TRIGGER" in abort|timeout|transport|unexpected-status|empty-events|malformed-event|daemon-error-event) trigger="$OBSERVED_PULL_TRIGGER" ;; esac
          case "$OBSERVED_RECONCILIATION" in completed|failed|not-attempted) reconciliation="$OBSERVED_RECONCILIATION" ;; esac
          if [[ "$supervisor" != unknown || "$failure" != unknown || "$material_phase" != unknown || "$untrusted_bootstrap_stage" != unknown || "$untrusted_builder_operation" != unknown || "$untrusted_builder_outcome" != unknown || "$untrusted_builder_observed" != unknown ]]; then
            observation="integration.mockserver-research.controller-observation supervisor=$supervisor code=$supervisor_code signal=$supervisor_signal contained=$contained residual=$residual termination=$termination within_deadline=$within_deadline failure=$failure stage=$stage kind=$kind cleanup=$cleanup trigger=$trigger reconciliation=$reconciliation material_phase=$material_phase untrusted_bootstrap_stage=$untrusted_bootstrap_stage untrusted_bootstrap_failure_family=$untrusted_bootstrap_failure_family"
            observation="$observation untrusted_builder_operation=$untrusted_builder_operation untrusted_builder_outcome=$untrusted_builder_outcome untrusted_builder_observed=$untrusted_builder_observed untrusted_builder_exited=$untrusted_builder_exited untrusted_builder_signaled=$untrusted_builder_signaled untrusted_builder_timed_out=$untrusted_builder_timed_out untrusted_builder_joined=$untrusted_builder_joined untrusted_builder_stderr_class=$untrusted_builder_stderr_class"
            observation="$observation untrusted_maven_failure=$untrusted_maven_failure"
            ( printf '%s\n' "$observation" ) || :
            { printf '%s\n' "$observation" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"; } 2>/dev/null || :
          fi
      - name: Upload bounded research observations only
        if: success() && steps.research_packet.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mockserver-supplier-research-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/integration/mockserver-research/inventory.json
            artifacts/integration/mockserver-research/receipt.json
          if-no-files-found: error
          retention-days: 7
