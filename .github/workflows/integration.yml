name: Integration matrix

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scenario:
        description: Exact manifest scenario ID to replay; empty selects the shard
        required: false
        type: string
      shard:
        description: Deterministic index/total shard selector
        required: false
        default: 0/1
        type: string

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-candidate:
    name: Prepare immutable candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - name: Establish job-scoped integration deadline
        run: echo "AGENTSCOPE_INTEGRATION_OUTER_DEADLINE_MONOTONIC_MS=$(awk '{ printf "%.0f", ($1 * 1000) + 1200000 }' /proc/uptime)" >> "$GITHUB_ENV"
      - name: Initialize closed npm configuration
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/agentscope-global.npmrc"
          install -m 600 /dev/null "$RUNNER_TEMP/agentscope-user.npmrc"
          echo "NPM_CONFIG_GLOBALCONFIG=$RUNNER_TEMP/agentscope-global.npmrc" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/agentscope-user.npmrc" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install immutable workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and prepare candidate once
        env:
          AGENTSCOPE_INTEGRATION_MODE: candidate
        run: |
          pnpm build
          pnpm test:integration
      - name: Publish checksum-bound candidate
        uses: actions/upload-artifact@v4
        with:
          name: integration-candidate-${{ github.sha }}
          path: |
            artifacts/integration/candidates
            artifacts/integration/current-candidate.json
          if-no-files-found: error
          retention-days: 1
  hermetic-platform:
    name: Hermetic shard ${{ matrix.shard.name }} replay ${{ matrix.replay }}
    needs: prepare-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    strategy:
      fail-fast: false
      matrix:
        shard:
          - selector: "0/1"
            name: 0-of-1
        replay: [1, 2]
    steps:
      - name: Establish job-scoped integration deadline
        run: echo "AGENTSCOPE_INTEGRATION_OUTER_DEADLINE_MONOTONIC_MS=$(awk '{ printf "%.0f", ($1 * 1000) + 1200000 }' /proc/uptime)" >> "$GITHUB_ENV"
      - name: Initialize closed npm configuration
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/agentscope-global.npmrc"
          install -m 600 /dev/null "$RUNNER_TEMP/agentscope-user.npmrc"
          echo "NPM_CONFIG_GLOBALCONFIG=$RUNNER_TEMP/agentscope-global.npmrc" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/agentscope-user.npmrc" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install immutable workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace fixture code
        run: pnpm build
      - name: Download exact prepared candidate
        uses: actions/download-artifact@v4
        with:
          name: integration-candidate-${{ github.sha }}
          path: artifacts/integration
      - name: Run the private integration lifecycle
        env:
          AGENTSCOPE_INTEGRATION_CONCURRENCY: "2"
          AGENTSCOPE_INTEGRATION_TIMEOUT_MS: "300000"
          REPLAY_SCENARIO: ${{ inputs.scenario }}
          REPLAY_SHARD: ${{ inputs.shard || matrix.shard.selector }}
        run: |
          if [ -n "$REPLAY_SCENARIO" ]; then
            export AGENTSCOPE_INTEGRATION_SCENARIO="$REPLAY_SCENARIO"
          else
            export AGENTSCOPE_INTEGRATION_SHARD="$REPLAY_SHARD"
          fi
          pnpm test:integration
      - name: Verify complete sanitized failure evidence
        id: failure_evidence
        if: failure()
        env:
          AGENTSCOPE_FAILURE_ARTIFACT_NAME: integration-${{ matrix.shard.name }}-${{ matrix.replay }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import {
            closeSync,
            constants,
            existsSync,
            fstatSync,
            lstatSync,
            openSync,
            readFileSync,
            readdirSync,
          } from "node:fs";
          import { resolve } from "node:path";
          import {
            compileCapabilityManifest,
            compileIsolationEvidence,
          } from "./tests/integration/dist/index.js";

          const fail = () => {
            throw new Error("integration.controller.failure-evidence");
          };
          const exactKeys = (value, keys) =>
            typeof value === "object" &&
            value !== null &&
            JSON.stringify(Object.keys(value).sort()) ===
              JSON.stringify([...keys].sort());
          const authenticatedDescriptors = [];
          const ptyFailurePredicates = {
            "candidate-inventory": ["candidate-rejected"],
            "immutable-candidate": ["authority-rejected"],
            "installed-cli": [
              "bin-authority", "cli-authority", "cli-boundary", "driver-input",
              "execution-rejected", "interpreter-authority", "package-authority",
              "package-manifest", "receipt-rejected",
            ],
            "pty-receipt": ["receipt-rejected"],
            "runner-bootstrap": ["runner-rejected"],
          };
          const installedContractFailurePredicates = {
            "aggregate-evaluation": ["evaluation-rejected"],
            "artifact-install": [
              "candidate-rejected", "egress-rejected", "install-rejected",
              "manifest-rejected", "plan-rejected", "toolchain-rejected",
            ],
            "case-execution": [
              "narrow-help-rejected", "setup-rejected", "state-rejected",
              "testkit.headless.aborted", "testkit.headless.backend.receipt",
              "testkit.headless.capability", "testkit.headless.kernel.failure",
              "testkit.headless.kernel.options", "testkit.headless.kernel.request",
              "testkit.headless.kernel.spawn", "testkit.headless.observer.identity",
              "testkit.headless.observer.read", "testkit.headless.observer.reap",
              "testkit.headless.observer.root",
              "testkit.headless.observer.signal",
              "testkit.headless.reconciliation.deadline",
              "testkit.headless.startup.deadline",
              "testkit.pty.immutable-candidate",
            ],
            "receipt-finalization": ["receipt-rejected"],
          };
          const installedContractCaseCount = 123;
          const installedContractInventorySha256 =
            "sha256:dae8f0a435924f6c33b338281b4b59c4f3ef6c5a540ab105366b50bf62b1a90a";
          const validPtyFailure = (value) =>
            value === null ||
            (exactKeys(value, ["phase", "predicate", "receiptVersion"]) &&
              value.receiptVersion === 1 &&
              Object.hasOwn(ptyFailurePredicates, value.phase) &&
              ptyFailurePredicates[value.phase].includes(value.predicate)) ||
            (exactKeys(
              value,
              value?.phase === "case-execution"
                ? ["caseOrdinal", "contractInventorySha256", "phase", "predicate", "receiptVersion"]
                : ["phase", "predicate", "receiptVersion"],
            ) &&
              value.receiptVersion === 1 &&
              Object.hasOwn(installedContractFailurePredicates, value.phase) &&
              installedContractFailurePredicates[value.phase].includes(
                value.predicate,
              ) &&
              (value.phase !== "case-execution" ||
                (Number.isSafeInteger(value.caseOrdinal) &&
                  value.caseOrdinal >= 0 &&
                  value.caseOrdinal < installedContractCaseCount &&
                  value.contractInventorySha256 ===
                    installedContractInventorySha256)));
          const readBounded = (path, maximumBytes, expectedMode = 0o600) => {
            let descriptor;
            try {
              descriptor = openSync(path, constants.O_RDONLY | constants.O_NOFOLLOW);
              const before = fstatSync(descriptor);
              if (
                !before.isFile() ||
                before.nlink !== 1 ||
                before.size < 1 ||
                before.size > maximumBytes ||
                (before.mode & 0o7777) !== expectedMode
              ) fail();
              const content = readFileSync(descriptor);
              const after = fstatSync(descriptor);
              if (
                after.dev !== before.dev ||
                after.ino !== before.ino ||
                after.size !== before.size ||
                after.nlink !== before.nlink
              ) fail();
              authenticatedDescriptors.push(descriptor);
              descriptor = undefined;
              return { content, status: before };
            } finally {
              if (descriptor !== undefined) closeSync(descriptor);
            }
          };
          const artifactsRoot = resolve("artifacts/integration");
          const runsRoot = resolve(artifactsRoot, "runs");
          const manifestPath = resolve(
            artifactsRoot,
            "controller-failure-manifest.json",
          );
          const terminalPath = resolve(
            artifactsRoot,
            "controller-failure-terminal.json",
          );
          const manifestPresent = existsSync(manifestPath);
          const terminalPresent = existsSync(terminalPath);
          if (!manifestPresent && !terminalPresent) fail();
          if (terminalPresent) {
            const terminal = JSON.parse(
              readBounded(terminalPath, 4096).content.toString("utf8"),
            );
            const terminalPredicates = {
              "require-evidence": ["authority-rejected"],
              "finalize-run": [
                "retained-evidence-unavailable",
                "run-finalization-rejected",
              ],
              "publish-manifest": ["manifest-publication-rejected"],
            };
            if (
              !exactKeys(terminal, [
                "controllerFailureTerminalVersion",
                "predicate",
                "stage",
              ]) ||
              terminal.controllerFailureTerminalVersion !== 1 ||
              !Object.hasOwn(terminalPredicates, terminal.stage) ||
              !terminalPredicates[terminal.stage].includes(terminal.predicate) ||
              (manifestPresent && terminal.stage !== "publish-manifest")
            ) fail();
            for (const descriptor of authenticatedDescriptors.splice(0))
              closeSync(descriptor);
            process.stdout.write(`${JSON.stringify({
              predicate: terminal.predicate,
              stage: terminal.stage,
            })}\n`);
            process.exit(1);
          }
          const manifestBytes = readBounded(manifestPath, 65_536).content;
          const manifest = JSON.parse(manifestBytes.toString("utf8"));
          if (
            !exactKeys(manifest, [
              "controllerAuthorityDigest",
              "controllerFailureManifestVersion",
              "failureEvidence",
              "retainedInputs",
              "runIds",
            ]) ||
            manifest.controllerFailureManifestVersion !== 1 ||
            !/^sha256:[a-f0-9]{64}$/u.test(manifest.controllerAuthorityDigest) ||
            !Array.isArray(manifest.runIds) ||
            !Array.isArray(manifest.failureEvidence) ||
            manifest.runIds.length < 1 ||
            manifest.runIds.length > 256 ||
            new Set(manifest.runIds).size !== manifest.runIds.length ||
            JSON.stringify(manifest.runIds) !==
              JSON.stringify([...manifest.runIds].sort()) ||
            manifest.failureEvidence.length !== manifest.runIds.length
          ) fail();
          const verifyDigests = (value, expectedNames, root, mode) => {
            if (!exactKeys(value, expectedNames)) fail();
            const parsed = {};
            for (const name of expectedNames) {
              if (!/^sha256:[a-f0-9]{64}$/u.test(value[name])) fail();
              const retained = readBounded(resolve(root, name), 1024 * 1024, mode);
              if (`sha256:${createHash("sha256").update(retained.content).digest("hex")}` !== value[name]) fail();
              parsed[name] = JSON.parse(retained.content.toString("utf8"));
            }
            return parsed;
          };
          if (!exactKeys(manifest.retainedInputs, [
            "capability-manifest.json",
            "current-candidate.json",
            "current-images.json",
            "current-model-routes.json",
            "current-selection.json",
          ])) fail();
          const retainedInputs = {
            ...verifyDigests(
              Object.fromEntries(Object.entries(manifest.retainedInputs).filter(([name]) => name !== "capability-manifest.json" && name !== "current-images.json")),
              ["current-candidate.json", "current-model-routes.json", "current-selection.json"],
              artifactsRoot,
              0o644,
            ),
            ...verifyDigests(
              { "current-images.json": manifest.retainedInputs["current-images.json"] },
              ["current-images.json"],
              artifactsRoot,
              0o600,
            ),
          };
          const retainedManifest = verifyDigests(
            { "capability-manifest.json": manifest.retainedInputs["capability-manifest.json"] },
            ["capability-manifest.json"],
            "tests/integration",
            0o644,
          );
          const candidate = retainedInputs["current-candidate.json"];
          const images = retainedInputs["current-images.json"];
          const routes = retainedInputs["current-model-routes.json"];
          const selection = retainedInputs["current-selection.json"];
          const capability = retainedManifest["capability-manifest.json"];
          try {
            compileCapabilityManifest(capability);
          } catch {
            fail();
          }
          if (
            !exactKeys(candidate, ["bundleIdentity", "candidateRevision", "pointerVersion"]) ||
            candidate.pointerVersion !== 1 ||
            !/^sha256-[a-f0-9]{64}$/u.test(candidate.bundleIdentity) ||
            !/^[a-f0-9]{40,64}$/u.test(candidate.candidateRevision) ||
            !exactKeys(capability, ["evidence", "manifestIdentity", "manifestVersion", "requiredRepresentativeIds", "scenarios"]) ||
            capability.manifestVersion !== 1 ||
            !/^sha256-[a-f0-9]{64}$/u.test(capability.manifestIdentity) ||
            !Array.isArray(capability.evidence) || !Array.isArray(capability.scenarios) ||
            !exactKeys(selection, ["manifestIdentity", "scenarioIds", "selectionMode", "selectionVersion", "selector"]) ||
            selection.selectionVersion !== 2 || selection.manifestIdentity !== capability.manifestIdentity ||
            !Array.isArray(selection.scenarioIds) ||
            !exactKeys(routes, ["mockServerInitialization", "routeFixtureVersion", "routeIds", "routes"]) ||
            routes.routeFixtureVersion !== 1 || !Array.isArray(routes.routeIds) || !Array.isArray(routes.routes) || !Array.isArray(routes.mockServerInitialization) ||
            !exactKeys(images, ["dockerDaemon", "dockerSocket", "imageEvidenceVersion", "images", "manifestIdentity", "preparationPolicy", "terminalCleanup"]) ||
            images.imageEvidenceVersion !== 2 || images.manifestIdentity !== capability.manifestIdentity || !Array.isArray(images.images)
          ) fail();
          const validLedger = (value) =>
            (exactKeys(value, ["status"]) && value.status === "uncertain") ||
            (exactKeys(value, ["entriesSha256", "entryCount", "overflow", "status"]) &&
              value.status === "authenticated" && Number.isSafeInteger(value.entryCount) &&
              value.entryCount >= 0 && value.entryCount <= 4096 && typeof value.overflow === "boolean" &&
              /^sha256:[a-f0-9]{64}$/u.test(value.entriesSha256));
          const samePreparedIdentity = (prepared, retained) =>
            prepared !== undefined &&
            exactKeys(retained, ["configDigest", "image", "manifestDigest", "platform"]) &&
            retained.image === prepared.image && retained.configDigest === prepared.configDigest &&
            retained.manifestDigest === prepared.manifestDigest &&
            JSON.stringify(retained.platform) === JSON.stringify(prepared.platform);
          const expected = new Set(manifest.runIds);
          const observed = [];
          const sanitizedRuns = [];
          for (const identity of manifest.failureEvidence) {
            if (
              !exactKeys(identity, ["dev", "digest", "ino", "runId", "size"]) ||
              !expected.has(identity.runId) ||
              !/^[a-f0-9]{16}$/u.test(identity.runId) ||
              !/^sha256:[a-f0-9]{64}$/u.test(identity.digest) ||
              !Number.isSafeInteger(identity.dev) ||
              !Number.isSafeInteger(identity.ino) ||
              !Number.isSafeInteger(identity.size)
            ) fail();
            const path = resolve(runsRoot, identity.runId, "controller-failure.json");
            const { content, status } = readBounded(path, 16_384);
            const record = JSON.parse(content.toString("utf8"));
            if (
              status.dev !== identity.dev ||
              status.ino !== identity.ino ||
              status.size !== identity.size ||
              `sha256:${createHash("sha256").update(content).digest("hex")}` !==
                identity.digest ||
              !exactKeys(record, [
                "cleanupFailure",
                "controllerFailureEvidenceVersion",
                "controllerOutcome",
                "installedPtyFailure",
                "primaryFailure",
                "privateCleanup",
                "retainedEvidence",
                "runId",
                "scenarioFailure",
                "scenarioSecondaryFailures",
                "scenarioOutcome",
              ]) ||
              record.controllerFailureEvidenceVersion !== 2 ||
              record.runId !== identity.runId ||
              record.controllerOutcome !== "retired-failure" ||
              !validPtyFailure(record.installedPtyFailure) ||
              !/^integration\.[a-z.-]{1,96}$/u.test(record.primaryFailure) ||
              !(record.scenarioFailure === null || /^integration\.[a-z.-]{1,96}$/u.test(record.scenarioFailure)) ||
              !Array.isArray(record.scenarioSecondaryFailures) ||
              record.scenarioSecondaryFailures.length > 2 ||
              new Set(record.scenarioSecondaryFailures).size !==
                record.scenarioSecondaryFailures.length ||
              record.scenarioSecondaryFailures.some(
                (failure) =>
                  !/^integration\.isolation\.(?:cleanup|evidence)$/u.test(
                    failure,
                  ),
              ) ||
              !(
                record.cleanupFailure === null ||
                /^integration\.[a-z.-]{1,96}$/u.test(record.cleanupFailure)
              ) ||
              !["passed", "failed", "interrupted", "not-complete"].includes(
                record.scenarioOutcome,
              )
            ) fail();
            const retained = verifyDigests(
              record.retainedEvidence,
              ["destination-ledger.json", "evidence.json", "fixture-lifecycle.json", "model-ledger.json"],
              resolve(runsRoot, identity.runId),
              0o600,
            );
            const evidence = retained["evidence.json"];
            const lifecycle = retained["fixture-lifecycle.json"];
            const modelLedger = retained["model-ledger.json"];
            const destinationLedger = retained["destination-ledger.json"];
            try {
              compileIsolationEvidence(evidence, {
                baseImageIdentity: evidence.baseImageIdentity,
                mockServerImageIdentity: evidence.mockServerImageIdentity,
                installedCliContractEvidence:
                  evidence.installedCliContractEvidence,
              });
            } catch {
              fail();
            }
            if (
              !exactKeys(evidence, ["baseImage", "baseImageIdentity", "builtImageDigest", "builtMockServerImageDigest", "candidateBundleIdentity", "candidateRevision", "cleanup", "evidenceVersion", "executionPolicy", "headlessTerminalReceipt", "hostMountCount", "installedCliContractEvidence", "manifestIdentity", "mockServerImage", "mockServerImageIdentity", "networkMode", "outcome", "readOnlyRootFilesystem", "runId", "scenarioId", "tmpfsMounts"]) ||
              evidence.evidenceVersion !== 2 || evidence.runId !== record.runId ||
              evidence.manifestIdentity !== capability.manifestIdentity || evidence.candidateBundleIdentity !== candidate.bundleIdentity ||
              evidence.candidateRevision !== candidate.candidateRevision || evidence.outcome !== record.scenarioOutcome ||
              !validLedger(modelLedger) || !exactKeys(destinationLedger, ["ingestion", "retrieval"]) ||
              !validLedger(destinationLedger.ingestion) || !validLedger(destinationLedger.retrieval) ||
              !exactKeys(lifecycle, lifecycle.resultStatus === "unavailable"
                ? ["evidenceVersion", "ledgerObservation", "resultStatus", "scenarioId"]
                : ["artifactFileName", "eventKinds", "evidenceVersion", "ledgerObservation", "lifecycle", "resultStatus", "scenarioId"]) ||
              lifecycle.evidenceVersion !== 1 || lifecycle.scenarioId !== evidence.scenarioId ||
              !exactKeys(lifecycle.ledgerObservation, ["ingestion", "model", "retrieval"]) ||
              !["authenticated", "uncertain"].includes(lifecycle.ledgerObservation.model) ||
              !["authenticated", "uncertain"].includes(lifecycle.ledgerObservation.ingestion) ||
              !["authenticated", "uncertain"].includes(lifecycle.ledgerObservation.retrieval)
            ) fail();
            const preparedBase = images.images.find((image) => image.image === evidence.baseImage);
            const preparedMock = images.images.find((image) => image.image === evidence.mockServerImage);
            const declaredScenario = capability.scenarios.find(
              (scenario) => scenario.scenarioId === evidence.scenarioId,
            );
            const cleanupComplete =
              exactKeys(evidence.cleanup, ["outcome", "remaining", "removalFailureCount"]) &&
              evidence.cleanup.outcome === "complete" && evidence.cleanup.removalFailureCount === 0 &&
              exactKeys(evidence.cleanup.remaining, ["activeRunMarkers", "buildContexts", "containers", "images", "networks", "volumes"]) &&
              Object.values(evidence.cleanup.remaining).every((count) => count === 0);
            const terminalComplete = evidence.headlessTerminalReceipt !== null &&
              evidence.headlessTerminalReceipt.outcome === "exited" && evidence.headlessTerminalReceipt.exitCode === 0 &&
              evidence.headlessTerminalReceipt.signal === null && evidence.headlessTerminalReceipt.cleanup === "clean" &&
              evidence.headlessTerminalReceipt.residualProcessCount === 0 && evidence.headlessTerminalReceipt.processJoined === true &&
              evidence.headlessTerminalReceipt.stdinJoined === true && evidence.headlessTerminalReceipt.stdoutJoined === true &&
              evidence.headlessTerminalReceipt.stderrJoined === true;
            const lifecycleComplete = lifecycle.resultStatus === "complete" &&
              /^agentscope-cli(?:-[0-9.]+)?\.tgz$/u.test(lifecycle.artifactFileName) &&
              JSON.stringify(lifecycle.lifecycle) === JSON.stringify(["install", "configure", "hook", "execute", "export", "retrieve", "uninstall"]) &&
              Array.isArray(lifecycle.eventKinds) && lifecycle.eventKinds.length > 0 && lifecycle.eventKinds.length <= 32 &&
              new Set(lifecycle.eventKinds).size === lifecycle.eventKinds.length &&
              lifecycle.eventKinds.every((kind) => /^[a-z][a-z0-9-]{0,63}$/u.test(kind));
            if (
              !selection.scenarioIds.includes(evidence.scenarioId) ||
              declaredScenario === undefined || declaredScenario.image !== evidence.baseImage ||
              declaredScenario.mockServerImage !== evidence.mockServerImage ||
              !Array.isArray(declaredScenario.modelRoutes) || declaredScenario.modelRoutes.some((route) => !routes.routeIds.includes(route)) ||
              !samePreparedIdentity(preparedBase, evidence.baseImageIdentity) ||
              !samePreparedIdentity(preparedMock, evidence.mockServerImageIdentity) ||
              (lifecycle.ledgerObservation.model === "authenticated") !== (modelLedger.status === "authenticated") ||
              (lifecycle.ledgerObservation.ingestion === "authenticated") !== (destinationLedger.ingestion.status === "authenticated") ||
              (lifecycle.ledgerObservation.retrieval === "authenticated") !== (destinationLedger.retrieval.status === "authenticated") ||
              record.scenarioOutcome === "not-complete" ||
              (evidence.outcome === "interrupted" && record.primaryFailure !== "integration.isolation.interrupted" && record.scenarioFailure !== "integration.isolation.interrupted") ||
              (evidence.outcome === "passed" && (!cleanupComplete || !terminalComplete || evidence.installedCliContractEvidence === null || evidence.builtImageDigest === null || evidence.builtMockServerImageDigest === null || !lifecycleComplete || modelLedger.status !== "authenticated" || modelLedger.overflow !== false || destinationLedger.ingestion.status !== "authenticated" || destinationLedger.ingestion.overflow !== false || destinationLedger.retrieval.status !== "authenticated" || destinationLedger.retrieval.overflow !== false))
            ) fail();
            sanitizedRuns.push({
              cleanupFailure: record.cleanupFailure,
              controllerOutcome: record.controllerOutcome,
              evidence: {
                baseImageIdentityDigest: `sha256:${createHash("sha256").update(JSON.stringify(evidence.baseImageIdentity)).digest("hex")}`,
                candidateBundleIdentity: evidence.candidateBundleIdentity,
                candidateRevision: evidence.candidateRevision,
                cleanupOutcome: evidence.cleanup.outcome,
                manifestIdentity: evidence.manifestIdentity,
                mockServerImageIdentityDigest: `sha256:${createHash("sha256").update(JSON.stringify(evidence.mockServerImageIdentity)).digest("hex")}`,
                outcome: evidence.outcome,
                runId: evidence.runId,
                scenarioId: evidence.scenarioId,
              },
              installedPtyFailure: record.installedPtyFailure,
              ledger: { destination: destinationLedger, model: modelLedger },
              lifecycle: {
                ledgerObservation: lifecycle.ledgerObservation,
                resultStatus: lifecycle.resultStatus,
              },
              primaryFailure: record.primaryFailure,
              runId: record.runId,
              scenarioFailure: record.scenarioFailure,
              scenarioSecondaryFailures: record.scenarioSecondaryFailures,
            });
            observed.push(identity.runId);
          }
          if (
            new Set(observed).size !== expected.size ||
            observed.some((runId) => !expected.has(runId))
          ) fail();
          const runDirectories = readdirSync(runsRoot, { withFileTypes: true });
          if (
            runDirectories.length !== expected.size ||
            runDirectories.some((entry) => {
              if (!entry.isDirectory() || !expected.has(entry.name)) return true;
              const status = lstatSync(resolve(runsRoot, entry.name));
              return !status.isDirectory() || status.isSymbolicLink();
            })
          ) fail();
          const bundle = Buffer.from(`${JSON.stringify({
            bundleVersion: 1,
            controllerAuthorityDigest: manifest.controllerAuthorityDigest,
            preparedInput: {
              candidate,
              images: {
                imageEvidenceVersion: images.imageEvidenceVersion,
                images: images.images,
                manifestIdentity: images.manifestIdentity,
              },
              manifest: capability,
              routes: {
                routeFixtureVersion: routes.routeFixtureVersion,
                routeIds: routes.routeIds,
              },
              selection,
            },
            retainedInputs: manifest.retainedInputs,
            runs: sanitizedRuns.sort((left, right) => left.runId.localeCompare(right.runId)),
          })}\n`);
          if (bundle.byteLength < 1 || bundle.byteLength > 1024 * 1024) fail();
          const bundleDigest = `sha256:${createHash("sha256").update(bundle).digest("hex")}`;
          const deadline = process.env.AGENTSCOPE_INTEGRATION_OUTER_DEADLINE_MONOTONIC_MS;
          if (!/^[1-9]\d{0,15}$/u.test(deadline ?? "")) fail();
          const deadlineNanoseconds = (BigInt(deadline) * 1_000_000n).toString();
          const sealPath = resolve("tests/integration/seal-failure-evidence.py");
          const uploaderPath = resolve("tests/integration/upload-failure-evidence.mjs");
          const artifactName = process.env.AGENTSCOPE_FAILURE_ARTIFACT_NAME;
          let resultsUrl;
          try { resultsUrl = new URL(process.env.ACTIONS_RESULTS_URL); } catch { fail(); }
          if (!/^[a-z0-9][a-z0-9_-]{0,127}$/u.test(artifactName ?? "") || process.env.GITHUB_SERVER_URL !== "https://github.com" || typeof process.env.GITHUB_WORKSPACE !== "string" || !process.env.GITHUB_WORKSPACE.startsWith("/") || !/^[A-Za-z0-9._-]{1,16384}$/u.test(process.env.ACTIONS_RUNTIME_TOKEN ?? "") || resultsUrl.protocol !== "https:" || !resultsUrl.hostname.endsWith(".actions.githubusercontent.com") || resultsUrl.username !== "" || resultsUrl.password !== "" || resultsUrl.port !== "" || resultsUrl.hash !== "") fail();
          const remainingMilliseconds = Number(BigInt(deadline) - (process.hrtime.bigint() / 1_000_000n));
          if (!Number.isSafeInteger(remainingMilliseconds) || remainingMilliseconds < 1 || remainingMilliseconds > 1_200_000) fail();
          const uploader = spawnSync("/usr/bin/python3", [sealPath, "seal", process.execPath, uploaderPath, artifactName, deadlineNanoseconds, bundleDigest], {
            env: {
              ACTIONS_RESULTS_URL: process.env.ACTIONS_RESULTS_URL,
              ACTIONS_RUNTIME_TOKEN: process.env.ACTIONS_RUNTIME_TOKEN,
              GITHUB_SERVER_URL: process.env.GITHUB_SERVER_URL,
              GITHUB_WORKSPACE: process.env.GITHUB_WORKSPACE,
            }, input: bundle, maxBuffer: 4096, stdio: ["pipe", "pipe", "pipe"], timeout: remainingMilliseconds,
          });
          if (uploader.error !== undefined || uploader.status !== 0 || uploader.signal !== null || uploader.stderr.length !== 0 || uploader.stdout.length < 1 || uploader.stdout.length > 1024) fail();
          const receipt = JSON.parse(uploader.stdout.toString("utf8"));
          if (!exactKeys(receipt, ["artifactDigest", "artifactId", "artifactSize", "status"]) || receipt.status !== "uploaded" || !Number.isSafeInteger(receipt.artifactId) || receipt.artifactId < 1 || !Number.isSafeInteger(receipt.artifactSize) || receipt.artifactSize < 1 || !/^sha256:[a-f0-9]{64}$/u.test(receipt.artifactDigest)) fail();
          const canonicalReceipt = `${JSON.stringify({ artifactDigest: receipt.artifactDigest, artifactId: receipt.artifactId, artifactSize: receipt.artifactSize, status: "uploaded" })}\n`;
          if (uploader.stdout.toString("utf8") !== canonicalReceipt) fail();
          for (const descriptor of authenticatedDescriptors.splice(0)) closeSync(descriptor);
          NODE
  hermetic-integration:
    name: hermetic-integration
    if: always()
    needs: [prepare-candidate, hermetic-platform]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every hermetic integration job
        env:
          CANDIDATE_RESULT: ${{ needs.prepare-candidate.result }}
          PLATFORM_RESULT: ${{ needs.hermetic-platform.result }}
        run: |
          test "$CANDIDATE_RESULT" = success
          test "$PLATFORM_RESULT" = success
