name: Integration matrix

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hermetic-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Run hermetic harness and reporter fixtures
        run: docker compose -f tests/integration/docker-compose.yml up --build --abort-on-container-exit
