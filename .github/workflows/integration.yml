name: Integration matrix

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scenario:
        description: Exact manifest scenario ID to replay; empty selects the shard
        required: false
        type: string
      shard:
        description: Deterministic index/total shard selector
        required: false
        default: 0/1
        type: string

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-candidate:
    name: Prepare immutable candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - name: Establish job-scoped integration deadline
        run: echo "AGENTSCOPE_INTEGRATION_OUTER_DEADLINE_MONOTONIC_MS=$(awk '{ printf "%.0f", ($1 * 1000) + 1200000 }' /proc/uptime)" >> "$GITHUB_ENV"
      - name: Initialize closed npm configuration
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/agentscope-global.npmrc"
          install -m 600 /dev/null "$RUNNER_TEMP/agentscope-user.npmrc"
          echo "NPM_CONFIG_GLOBALCONFIG=$RUNNER_TEMP/agentscope-global.npmrc" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/agentscope-user.npmrc" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install immutable workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and prepare candidate once
        env:
          AGENTSCOPE_INTEGRATION_MODE: candidate
        run: |
          pnpm build
          pnpm test:integration
      - name: Publish checksum-bound candidate
        uses: actions/upload-artifact@v4
        with:
          name: integration-candidate-${{ github.sha }}
          path: |
            artifacts/integration/candidates
            artifacts/integration/current-candidate.json
          if-no-files-found: error
          retention-days: 1
  hermetic-platform:
    name: Hermetic shard ${{ matrix.shard.name }} replay ${{ matrix.replay }}
    needs: prepare-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    strategy:
      fail-fast: false
      matrix:
        shard:
          - selector: "0/1"
            name: 0-of-1
        replay: [1, 2, 3]
    steps:
      - name: Establish job-scoped integration deadline
        run: echo "AGENTSCOPE_INTEGRATION_OUTER_DEADLINE_MONOTONIC_MS=$(awk '{ printf "%.0f", ($1 * 1000) + 1200000 }' /proc/uptime)" >> "$GITHUB_ENV"
      - name: Initialize closed npm configuration
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/agentscope-global.npmrc"
          install -m 600 /dev/null "$RUNNER_TEMP/agentscope-user.npmrc"
          echo "NPM_CONFIG_GLOBALCONFIG=$RUNNER_TEMP/agentscope-global.npmrc" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/agentscope-user.npmrc" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install immutable workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace fixture code
        run: pnpm build
      - name: Download exact prepared candidate
        uses: actions/download-artifact@v4
        with:
          name: integration-candidate-${{ github.sha }}
          path: artifacts/integration
      - name: Run the private integration lifecycle
        env:
          AGENTSCOPE_INTEGRATION_CONCURRENCY: "2"
          AGENTSCOPE_INTEGRATION_TIMEOUT_MS: "300000"
          AGENTSCOPE_SUBSTRATE_CERTIFICATION_REPLAY: ${{ matrix.replay }}
          REPLAY_SCENARIO: ${{ inputs.scenario }}
          REPLAY_SHARD: ${{ inputs.shard || matrix.shard.selector }}
        run: |
          if [ -n "$REPLAY_SCENARIO" ]; then
            export AGENTSCOPE_INTEGRATION_SCENARIO="$REPLAY_SCENARIO"
          else
            export AGENTSCOPE_INTEGRATION_SHARD="$REPLAY_SHARD"
          fi
          pnpm test:integration
      - name: Verify complete sanitized failure evidence
        id: failure_evidence
        if: failure()
        run: node tests/integration/verify-substrate-certification.mjs failure
      - name: Upload sanitized failure evidence
        if: failure() && steps.failure_evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.shard.name }}-${{ matrix.replay }}
          path: |
            artifacts/integration/controller-failure-manifest.json
            artifacts/integration/runs/*/controller-failure.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload clean certification receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: substrate-certification-replay-${{ matrix.replay }}-${{ github.sha }}
          path: artifacts/integration/certification/replay-${{ matrix.replay }}.json
          if-no-files-found: error
          retention-days: 7
  controlled-negative:
    name: Substrate rejects ${{ matrix.case }}
    needs: prepare-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    strategy:
      fail-fast: false
      matrix:
        case:
          - wrong-argv
          - wrong-environment
          - wrong-cwd
          - missing-hook
          - leaked-child
          - unbounded-output
          - false-success
          - mixed-artifact-digest
          - public-egress
          - credential-presence
          - cleanup-failure
    steps:
      - name: Establish job-scoped integration deadline
        run: echo "AGENTSCOPE_INTEGRATION_OUTER_DEADLINE_MONOTONIC_MS=$(awk '{ printf "%.0f", ($1 * 1000) + 1200000 }' /proc/uptime)" >> "$GITHUB_ENV"
      - name: Initialize closed npm configuration
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/agentscope-global.npmrc"
          install -m 600 /dev/null "$RUNNER_TEMP/agentscope-user.npmrc"
          echo "NPM_CONFIG_GLOBALCONFIG=$RUNNER_TEMP/agentscope-global.npmrc" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/agentscope-user.npmrc" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install immutable workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace fixture code
        run: pnpm build
      - name: Download exact prepared candidate
        uses: actions/download-artifact@v4
        with:
          name: integration-candidate-${{ github.sha }}
          path: artifacts/integration
      - name: Run one terminal controlled rejection
        id: controlled_rejection
        continue-on-error: true
        env:
          AGENTSCOPE_INTEGRATION_CONCURRENCY: "1"
          AGENTSCOPE_INTEGRATION_SCENARIO: fixture-process-smoke
          AGENTSCOPE_INTEGRATION_TIMEOUT_MS: "300000"
          AGENTSCOPE_SUBSTRATE_CERTIFICATION_CASE: ${{ matrix.case }}
        run: |
          if test "$AGENTSCOPE_SUBSTRATE_CERTIFICATION_CASE" = credential-presence; then
            export OPENAI_API_KEY=AGENTSCOPE_SYNTHETIC_CANARY
          fi
          pnpm test:integration
      - name: Require exact sanitized rejection evidence
        if: always()
        env:
          AGENTSCOPE_SUBSTRATE_CERTIFICATION_CASE: ${{ matrix.case }}
          CONTROLLED_REJECTION_OUTCOME: ${{ steps.controlled_rejection.outcome }}
        run: |
          test "$CONTROLLED_REJECTION_OUTCOME" = failure
          node tests/integration/verify-substrate-certification.mjs negative
      - name: Upload sanitized controlled-rejection evidence
        if: success() && matrix.case != 'credential-presence'
        uses: actions/upload-artifact@v4
        with:
          name: substrate-certification-negative-${{ matrix.case }}-${{ github.sha }}
          path: |
            artifacts/integration/controller-failure-manifest.json
            artifacts/integration/runs/*/controller-failure.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload sanitized preflight rejection evidence
        if: success() && matrix.case == 'credential-presence'
        uses: actions/upload-artifact@v4
        with:
          name: substrate-certification-negative-${{ matrix.case }}-${{ github.sha }}
          path: artifacts/integration/controller-preflight-failure.json
          if-no-files-found: error
          retention-days: 7
  substrate-certification-fan-in:
    name: substrate-certification
    needs: hermetic-platform
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install immutable workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build certification verifier
        run: pnpm --filter @agentscope/integration build
      - name: Download exactly three clean receipts
        uses: actions/download-artifact@v4
        with:
          pattern: substrate-certification-replay-*-${{ github.sha }}
          path: artifacts/integration/certification-fan-in
          merge-multiple: true
      - name: Compare exact stable replay identities
        run: |
          chmod 600 artifacts/integration/certification-fan-in/replay-*.json
          node tests/integration/verify-substrate-certification.mjs fan-in
  hermetic-integration:
    name: hermetic-integration
    if: always()
    needs:
      [
        prepare-candidate,
        hermetic-platform,
        controlled-negative,
        substrate-certification-fan-in,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every hermetic integration job
        env:
          CANDIDATE_RESULT: ${{ needs.prepare-candidate.result }}
          NEGATIVE_RESULT: ${{ needs.controlled-negative.result }}
          PLATFORM_RESULT: ${{ needs.hermetic-platform.result }}
          CERTIFICATION_RESULT: ${{ needs.substrate-certification-fan-in.result }}
        run: |
          test "$CANDIDATE_RESULT" = success
          test "$PLATFORM_RESULT" = success
          test "$NEGATIVE_RESULT" = success
          test "$CERTIFICATION_RESULT" = success
