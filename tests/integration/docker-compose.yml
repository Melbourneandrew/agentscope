services:
  collector:
    image: node@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    working_dir: /workspace
    command: ["node", "tests/integration/collector/server.mjs"]
    volumes: ["../..:/workspace:ro"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4318').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 15
  integration:
    image: node@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    working_dir: /workspace
    depends_on:
      collector:
        condition: service_healthy
    environment:
      CI: "true"
      AGENTSCOPE_COLLECTOR_URL: http://collector:4318
      AGENTSCOPE_HOME: /tmp/.agentscope
      AGENTSCOPE_CANDIDATE_ROOT: /prepared
    command: ["node", "tests/integration/runner.mjs"]
    volumes:
      - ../..:/workspace:ro
      - ../../artifacts/integration:/prepared:ro
